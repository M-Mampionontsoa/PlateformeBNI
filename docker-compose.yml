services:

  mysql:
    image: mysql:8.4
    container_name: bni_mysql

    environment:
      MYSQL_DATABASE: dw_mvp
      MYSQL_USER: dw_user
      MYSQL_PASSWORD: dw_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: bni_backend

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dw_mvp
      DB_USER: dw_user
      DB_PASSWORD: dw_password

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: bni_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  mysql_data:
